[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cloud-tasks"
version = "0.3.1"
description = "Unified iCloud and Google tasks with a native GTK app"
requires-python = ">=3.10"
license = "MIT"

[project.scripts]
cloud-tasks = "cloud_tasks.cli:main"

[tool.setuptools]
packages = ["cloud_tasks"]
